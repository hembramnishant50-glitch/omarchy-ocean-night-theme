foreground #AAC5DD
background #050A2D
selection_foreground #E4F2FC
selection_background #0E285B

cursor #E4F2FC
cursor_text_color #050A2D

active_border_color #4995DD
active_tab_background #4995DD

# --- Cursor: beam + blink (drives the "writing" feel) ---
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0

# --- Text "writing" trail animation ---
# Trails follow the cursor as it jumps while typing, so text reads as
# written out rather than instant.
cursor_trail 100
cursor_trail_decay 0.06 0.2
cursor_trail_start_threshold 1
cursor_trail_color #3FD4E8

